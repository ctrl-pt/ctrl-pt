name: Refresh profile visuals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'web/**'
      - '.github/workflows/update-profile.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: profile-visual-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PROFILE_USERNAME: ctrl-pt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current public activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh-data.py
      - name: Generate profile SVGs
        run: python scripts/render_profile.py
      - name: Regenerate the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ env.PROFILE_USERNAME }}
          outputs: |
            assets/readme/snake.gif?color_background=#071f2a&color_snake=#73b5ff&color_dots=#113440,#206058,#2f8b77,#3db796,#4de3ca
            assets/readme/snake.svg?color_snake=#73b5ff&color_dots=#113440,#206058,#2f8b77,#3db796,#4de3ca
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create reduced-motion snake
        run: python scripts/freeze_snake.py
      - name: Refresh live image proxy revisions
        run: python scripts/update-image-revision.py
      - name: Commit refreshed visual assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md data/github.json assets/readme
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh profile visuals'
          git push
      - name: Build the interactive profile and shared graphics
        run: node scripts/build-pages.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
