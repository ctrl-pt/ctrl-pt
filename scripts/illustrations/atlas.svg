<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="atlas-title atlas-desc">
  <title id="atlas-title">Atlas — FRC Team 2854 competition robot</title>
  <desc id="atlas-desc">Detailed three-quarter illustration based on the portfolio's competition and construction photographs: a low black wedge chassis, three exposed gray intake rollers, blue rubber shooter wheels, aluminum framing, belt and pulley mechanisms, and the blue 2854 competition bumper.</desc>
